name: daily screener card

on:
  schedule:
    # UTC 기준. 아래는 한국시간 07:20, 화~토(KST) = 월~금(UTC) 22:20.
    # send_screener_briefing.py가 화~토 07:05 KST에 원문을 보내므로 그 뒤에 돌게 함.
    - cron: "20 22 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "발송 없이 HTML/PNG만 생성"
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: install
        run: |
          # 러너에 한글 폰트가 없으면 캡처가 전부 □ 로 깨진다
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          pip install -r requirements.txt
          playwright install --with-deps chromium

      # getUpdates offset을 캐시에 보관해 같은 리포트를 두 번 처리하지 않는다
      - uses: actions/cache@v4
        with:
          path: .tg_offset
          key: tg-offset-${{ github.run_id }}
          restore-keys: tg-offset-

      - name: fetch + build + send
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TG_SOURCE_CHAT: ${{ secrets.TG_SOURCE_CHAT }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
        run: |
          set -o pipefail
          {
            python fetch_telegram.py > report.txt
            python build.py report.txt --shot --strict \
              ${{ inputs.dry_run && ' ' || '--send' }}
          } 2>&1 | tee build.log

      - name: 실패 알림 (텔레그램)
        if: failure()
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          detail=$(tail -c 800 build.log 2>/dev/null || echo "(build.log 없음 — install/checkout 단계에서 실패)")
          run_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          msg=$(printf '⚠️ tg-screener 빌드 실패\n\n%s\n%s\n\n%s' "$(date -u +'%Y-%m-%d %H:%M UTC')" "$detail" "$run_url")
          curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT_ID}" \
            --data-urlencode "text=${msg}" > /dev/null

      - name: index.html — 최신 리포트로 리다이렉트
        run: |
          latest=$(ls out/*.html | sort | tail -1 | xargs basename)
          echo "<!doctype html><meta http-equiv=refresh content=0;url=$latest>" > out/index.html

      - name: 결과 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screener-out
          path: out/
          retention-days: 14

      - uses: peaceiris/actions-gh-pages@v4
        if: ${{ !inputs.dry_run }}
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          keep_files: true
